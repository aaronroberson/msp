# Curated command manifest (plan §3.1). One [[command]] per CLI action.
#
#   id          group.action (spaces → dots); unique
#   argv        tokens after `msp`
#   emits       Envelope[Record] from src/schemas (D10, D12)
#   encoding    list | keyed | wrapped | scalar-list | object | text (P0.2)
#   data_key    wrapped: key holding the data;  key_field: keyed: field for the key
#   channel     "stdout" (default) or "artifact:<option>" when the output is a file
#   success     accepted exit codes (default [0])
#   fixture     tests/fixtures/cli/<fixture>.json, when one was captured
#
# Seeded inventory: commands.seed.json (generated; do not edit).

