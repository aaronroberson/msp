# Security ▸ Firewall (plan §3.4 example; template: explorer).
# One `firewall status` run feeds the strip, the settings panel and the rules table.

[page]
id = "security.firewall"
concern = "security"
title = "Firewall"
order = 2
template = "explorer"

[[runs]]
id = "fw"
command = "firewall.status"
trigger = "on_open"
order = 1

[[runs]]
id = "toggle"
command = "firewall.set"
trigger = "on_action"
refreshes = ["fw"]

[[runs]]
id = "rule"
command = "firewall.app"
trigger = "on_action"
refreshes = ["fw"]

[[slots]]
region = "notice"
order = 1
run = "fw"
facet = "errors"
component = "NoticeBanner"

[[slots]]
region = "strip"
order = 1
run = "fw"
select = "{enabled: enabled, stealth_mode: stealth_mode, block_all: block_all}"
component = "StatusStrip"

[[slots]]
region = "workspace.main"
order = 1
run = "fw"
select = "{stealth_mode: stealth_mode, block_all: block_all, allows_signed: allows_signed, allows_signed_app: allows_signed_app}"
component = "SettingsPanel"
actions = ["toggle"]

[[slots]]
region = "workspace.main"
order = 2
run = "fw"
select = "apps"
component = "RecordTable"
props = { columns = ["name", "status"] }

[[slots]]
region = "workspace.aside"
order = 1
follows = "workspace.main#2"
component = "RecordInspector"
row_actions = ["rule"]
