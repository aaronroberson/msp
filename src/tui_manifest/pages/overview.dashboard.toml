# Overview ▸ Dashboard (template: dashboard). Five fast reads open in parallel;
# findings come from the latest *saved* scan (via doctor), so opening the page
# never starts a 30 s+ scan. "Run scan quick" executes one and refreshes it.

[page]
id = "overview.dashboard"
concern = "overview"
title = "Dashboard"
order = 1
template = "dashboard"

[[runs]]
id = "status"
command = "privacy.status"
order = 1

[[runs]]
id = "listening"
command = "net.list"
order = 1

[[runs]]
id = "connections"
command = "net.established"
order = 1

[[runs]]
id = "startup"
command = "startup.managed"
order = 1

[[runs]]
id = "doctor"
command = "doctor"
order = 1

[[runs]]
id = "scan"
command = "scan.quick"
trigger = "manual"
order = 2
refreshes = ["doctor"]

[[slots]]
region = "notice"
order = 1
run = "status"
facet = "errors"
component = "NoticeBanner"

[[slots]]
region = "strip"
order = 1
run = "status"
select = "{firewall: firewall.enabled, gatekeeper: gatekeeper.enabled, filevault: filevault.enabled}"
component = "StatusStrip"

[[slots]]
region = "strip"
order = 2
run = "listening"
select = "length(@)"
component = "KPICell"
props = { title = "Listening" }

[[slots]]
region = "strip"
order = 3
run = "connections"
select = "length(@)"
component = "KPICell"
props = { title = "Connections" }

[[slots]]
region = "strip"
order = 4
run = "startup"
select = "length(@)"
component = "KPICell"
props = { title = "Startup items" }

[[slots]]
region = "workspace.main"
order = 1
run = "listening"
component = "RecordTable"
[slots.props]
title = "Top listening sockets"
columns = ["protocol", "local", "process", "pid"]
limit = 6
link = "listening"
link_label = "View network"

[[slots]]
region = "workspace.main"
order = 2
run = "startup"
component = "RecordTable"
[slots.props]
title = "Startup items"
columns = ["label", "type", "status"]
limit = 6
link = "startup"

[[slots]]
region = "workspace.main"
order = 3
run = "doctor"
select = "scan.checks[?status != 'ok' && status != 'n/a'].{id: name, title: title, severity: status, category: domain}"
component = "FindingList"
[slots.props]
title = "Findings from the last scan"
span = 2
limit = 5
columns = ["category", "title"]
link = "findings"
link_label = "Manage findings"
empty = "No open findings in the last saved scan. Use “Run scan quick” to scan now."
