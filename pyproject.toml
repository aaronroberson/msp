[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macos-privacy-cli"
version = "0.2.0"
description = "Local-first macOS security and privacy CLI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "argcomplete>=3.0.0",
  "rich>=13.0.0",
  "python-xli>=0.2.0",
  "textual>=0.80.0",
]

[project.optional-dependencies]
llm = [
  "openai>=1.0.0",
]
test = [
  "pytest>=7.0",
  "mypy>=1.8",
]

[project.scripts]
msp = "src.main:main"
mac-privacy = "src.main:main"
mpc = "src.main:main"
msp-interrogate = "src.facts:main"
msp-reason = "src.llm:main"
msp-remediate = "src.remediate:main"
msp-report = "src.report:main"
msp-workflow = "src.workflows:main"
msp-forensics = "src.forensics:main"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
follow_imports = "normal"
