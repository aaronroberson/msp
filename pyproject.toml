[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macos-privacy-cli"
version = "0.2.0"
description = "Local-first macOS security and privacy CLI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "argcomplete>=3.0.0",
  "rich>=13.0.0",
  "python-xli>=0.2.0",
]

[project.optional-dependencies]
llm = [
  "openai>=1.0.0",
]
test = [
  "pytest>=7.0",
]

[project.scripts]
msp = "main:main"
mac-privacy = "main:main"
mpc = "main:main"
msp-interrogate = "src.facts:main"
msp-reason = "src.llm:main"
msp-remediate = "src.remediate:main"
msp-report = "src.report:main"
msp-workflow = "src.workflows:main"
msp-forensics = "src.forensics:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
